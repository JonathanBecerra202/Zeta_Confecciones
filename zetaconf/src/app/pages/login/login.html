<div class="login-wrapper">
  <form class="login-box" (ngSubmit)="onSubmit()">
    <h1>Zeta Confecciones</h1>
    <p class="subtitle">Sistema de gestión del taller</p>

    <label for="email">Correo electrónico</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" required />

    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" [(ngModel)]="password" required />

    @if (errorMsg()) {
      <p class="error">{{ errorMsg() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
